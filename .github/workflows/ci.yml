name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          texlive_version: 2026
          packages: >-
            scheme-basic patgen iftex luaotfload luatex xetex fontspec
            hyperref geometry cm-unicode
      - name: Verify regenerated sources
        run: |
          make update
          git diff --exit-code || { echo 'Generated files are stale; run make update'; exit 1; }
      - run: make test
      - run: make check
      - run: make doc
