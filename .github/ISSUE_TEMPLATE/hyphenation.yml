name: Hyphenation issue
description: Report a word that is hyphenated incorrectly.
title: "[Hyphenation] "
body:
  - type: input
    id: word
    attributes:
      label: Word
      description: Enter the Azerbaijani word exactly as used.
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected hyphenation
      description: Show expected breakpoints with hyphens if known.
    validations:
      required: true
  - type: input
    id: observed
    attributes:
      label: Observed hyphenation
      description: Show the breakpoints produced by azhyphen.
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - LuaLaTeX
        - XeLaTeX
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: azhyphen version
      placeholder: x.y.z
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: Add a small, non-sensitive example when it helps reproduce the issue.
      render: tex
